<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>沖繩自駕四日遊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 旅行手帳 — sticky day tabs; map card + gray brush-rail timeline (from the original itinerary images); two columns from 900px */
:root {
  --paper: #efeee9;
  --card: #f8f7f3;
  --ink: #3d3d3a;
  --ink-soft: #67665f;
  --rail: #d5d4cd;
  --line: #dcdbd4;
  --perf: #c4c3bb;
  --sea: #d5e8e7;
  --reef: #bfe2da;
  --land: #fbfaf6;
  --coast: #a7bebb;
  --map-label: #536663;
  --d1: #2d63a8;
  --d2: #08776c;
  --d3: #b84424;
  --d4: #806000;
  --pin-ink: #ffffff;
  --f-display: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1c1c1a; --card: #262624; --ink: #e8e6df; --ink-soft: #a8a69e; --rail: #3e3d39; --line: #363532; --perf: #4d4c47;
    --sea: #13262a; --reef: #1b3739; --land: #2a2b29; --coast: #4b5f5c; --map-label: #93a6a3;
    --d1: #79a8ea; --d2: #41c3b4; --d3: #f08261; --d4: #e2b84a; --pin-ink: #10131a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1c1c1a; --card: #262624; --ink: #e8e6df; --ink-soft: #a8a69e; --rail: #3e3d39; --line: #363532; --perf: #4d4c47;
  --sea: #13262a; --reef: #1b3739; --land: #2a2b29; --coast: #4b5f5c; --map-label: #93a6a3;
  --d1: #79a8ea; --d2: #41c3b4; --d3: #f08261; --d4: #e2b84a; --pin-ink: #10131a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.6 var(--f-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
[hidden] { display: none !important; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.top { padding-block: 28px 18px; display: grid; gap: 16px; }
.title { display: grid; gap: 6px; align-content: end; }
.eyebrow { margin: 0; display: flex; align-items: center; gap: 12px; font: 500 12px/1 var(--f-mono); letter-spacing: .16em; color: var(--ink-soft); }
/* four day colours, like a strip of bingata swatches */
.eyebrow::after {
  content: ""; flex: 0 0 auto; width: 64px; height: 5px; border-radius: 3px 1px 3px 1px;
  background: linear-gradient(90deg, var(--d1) 0 22%, transparent 0 26%, var(--d2) 0 48%, transparent 0 52%, var(--d3) 0 74%, transparent 0 78%, var(--d4) 0);
}
.top h1 { margin: 4px 0 0; font: 700 clamp(2.1rem, 8.4vw, 3rem)/1.15 var(--f-display); letter-spacing: .02em; text-wrap: balance; }
.sub { margin: 0; color: var(--ink-soft); font-size: 14.5px; }
.nw { white-space: nowrap; }

/* Flights: boarding-pass stubs */
.flights { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); }
.flight {
  --stub: 44px;
  position: relative; display: grid; grid-template-columns: var(--stub) minmax(0, 1fr); min-width: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
.flight::before, .flight::after {
  content: ""; position: absolute; left: calc(var(--stub) - 8px); width: 16px; height: 16px; border-radius: 50%;
  background: var(--paper); border: 1px solid var(--line);
}
.flight::before { top: -9px; }
.flight::after { bottom: -9px; }
.fl-stub { display: grid; place-items: center; border-right: 1.5px dashed var(--perf); padding-block: 12px; }
.fl-label { writing-mode: vertical-rl; font: 700 17px/1 var(--f-display); letter-spacing: .35em; margin-bottom: -.35em; color: var(--dc); }
.fl-main { display: grid; gap: 8px; align-content: start; padding: 11px 14px 12px 16px; min-width: 0; }
.fl-head { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: 13px; color: var(--ink-soft); }
.fl-date { font-weight: 500; color: var(--ink); }
.fl-no { margin-left: auto; font: 500 12.5px/1.4 var(--f-mono); letter-spacing: .03em; }
.fl-route { display: grid; grid-template-columns: auto minmax(28px, 1fr) auto; align-items: start; column-gap: 12px; }
.fl-pt { display: grid; }
.fl-pt:last-child { text-align: right; }
.fl-time { font: 500 1.75rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.fl-city { margin-top: 3px; font-size: 13px; font-weight: 700; line-height: 1.4; }
.fl-sub { font-size: 12px; color: var(--ink-soft); }
.fl-line { position: relative; margin-top: calc(1.75rem * 1.1 / 2); height: 0; border-top: 1.5px dashed var(--dc); }
.fl-line::before {
  content: ""; position: absolute; left: -3px; top: -4.75px; width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid var(--dc); background: var(--card);
}
.fl-line::after { content: ""; position: absolute; right: -2px; top: -5.75px; border: 5px solid transparent; border-right: 0; border-left: 7px solid var(--dc); }
.fl-tz { grid-column: 1 / -1; margin: 0; font-size: 12.5px; color: var(--ink-soft); }

/* Key times: a ruled timetable */
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); column-gap: 28px; border-top: 1px dotted var(--perf); }
.key {
  display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 46px;
  padding: 6px 6px 6px 2px; text-align: left; cursor: pointer;
  border: 0; border-bottom: 1px dotted var(--perf); border-radius: 0; background: none; transition: background .2s;
}
.key::after { content: ""; width: 6px; height: 6px; margin-right: 2px; border: solid var(--ink-soft); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); }
.key:hover { background: var(--card); }
.key .t { font: 500 13px/1 var(--f-mono); background: var(--dc); color: var(--pin-ink); padding: 5px 7px; border-radius: 5px; font-variant-numeric: tabular-nums; }
.key .d { font: 500 12px/1 var(--f-mono); color: var(--ink-soft); }
.key .n { font-weight: 500; font-size: 14.5px; line-height: 1.35; }

/* Day tabs */
.tabs-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--paper); border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 5px; overflow-x: auto; padding-block: 12px 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; flex: 1 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "no dw" "dt dt";
  column-gap: 5px; align-content: center; align-items: baseline; min-height: 50px; padding: 5px 7px 8px;
  text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 10px;
  box-shadow: inset 0 -3px 0 var(--dc); transition: background .2s, border-color .2s;
}
.tab:hover { border-color: var(--dc); }
.tab .no { grid-area: no; font: 500 10.5px/1.3 var(--f-mono); letter-spacing: .06em; color: var(--dc); white-space: nowrap; }
.tab .dw { grid-area: dw; justify-self: end; font: 500 11px/1.3 var(--f-body); color: var(--ink-soft); }
.tab .dt { grid-area: dt; font-weight: 700; font-size: 15px; line-height: 1.3; white-space: nowrap; font-variant-numeric: tabular-nums; }
/* sticker for today's tab (only shows during the trip) */
.tab .today {
  position: absolute; top: -9px; right: 3px; padding: 3px 5px; border-radius: 4px;
  font: 700 10px/1 var(--f-body); letter-spacing: .05em; background: var(--ink); color: var(--paper); transform: rotate(5deg);
}
.tab[aria-selected="true"] { background: var(--dc); border-color: var(--dc); color: var(--pin-ink); box-shadow: none; }
.tab[aria-selected="true"] .no, .tab[aria-selected="true"] .dw { color: var(--pin-ink); }
@media (min-width: 640px) {
  .tab { flex: 0 0 auto; min-width: 108px; }
}

/* Main grid */
.main { display: grid; gap: 24px; padding-block: 18px 36px; }

/* Map */
.mapcard { min-width: 0; }
.map-wrap {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1.1; max-height: 64vh;
  border-radius: 14px; overflow: hidden; background: var(--sea); border: 1px solid var(--line);
}
/* paper margin + neatline, like a printed map pasted into the notebook */
.map-wrap::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  border: 5px solid var(--card); border-radius: 13px; box-shadow: inset 0 0 0 1px var(--coast);
}
#map { display: block; width: 100%; height: 100%; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#map .sea { fill: var(--sea); }
#map .reef { fill: none; stroke: var(--reef); stroke-linejoin: round; }
#map .land { fill: var(--land); stroke: var(--coast); stroke-linejoin: round; }
#map .town { font: 600 12px var(--f-body); fill: var(--map-label); letter-spacing: .12em; }
#map .ocean { font: 400 15px var(--f-display); fill: var(--map-label); letter-spacing: .5em; }
#map.view-day .town { display: none; }
#map .route { fill: none; stroke: var(--dc); stroke-linecap: round; stroke-linejoin: round; opacity: .9; transition: opacity .3s; }
#map .route.is-off { opacity: .18; }
#map .lead { stroke: var(--dc); }
#map .anchor { fill: var(--dc); }
#map .pin { cursor: pointer; outline: none; }
#map .pin .dot { fill: var(--dc); stroke: var(--land); stroke-width: 2; }
#map .pin .num { font: 500 11.5px var(--f-mono); fill: var(--pin-ink); text-anchor: middle; }
#map .pin .lab {
  font: 700 12.5px var(--f-body); fill: var(--ink);
  paint-order: stroke; stroke: var(--land); stroke-width: 4px; stroke-linejoin: round;
}
#map .pin .ring { fill: none; stroke: var(--dc); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
#map .pin.is-dim { opacity: .5; }
#map .pin.is-dim .num, #map .pin.is-dim .lab, #map.view-all .pin .lab { display: none; }
#map .pin.is-hot .dot, #map .pin:focus-visible .dot { stroke: var(--ink); stroke-width: 2.5; }
#map .pin.is-hot .ring { animation: ring 1.1s ease-out 2; }
@keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }

.compass, .scale {
  position: absolute; z-index: 1; border: 1px solid var(--line); border-radius: 8px;
  background: color-mix(in srgb, var(--card) 86%, transparent); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  font: 500 11px/1 var(--f-mono); color: var(--ink-soft);
}
/* the island runs SW–NE, so stops gather on that diagonal; keep the legend in the empty NW / SE corners */
.compass { top: 12px; left: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 7px 7px; }
.compass svg { display: block; width: 10px; height: 20px; overflow: visible; }
.compass .nh { fill: var(--ink-soft); }
.compass .sh { fill: none; stroke: var(--ink-soft); stroke-width: 1; stroke-linejoin: round; }
.scale { right: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; padding: 6px 9px; }
.scale-bar { height: 6px; border: 1px solid var(--ink-soft); background: linear-gradient(90deg, var(--ink-soft) 50%, transparent 0); }
.map-note { position: relative; margin: 10px 2px 0; padding-left: 32px; font-size: 12.5px; line-height: 1.55; color: var(--ink-soft); }
.map-note::before { content: ""; position: absolute; left: 0; top: .74em; width: 22px; border-top: 2px dashed var(--ink-soft); }

/* Plan */
.plan { display: grid; gap: 44px; min-width: 0; }
.day { min-width: 0; }
.stop { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 84px); scroll-margin-bottom: 12px; }
.day-head {
  position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: minmax(36px, auto) auto;
  align-items: baseline; gap: 2px 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
}
.day-head::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 52px; height: 3px; border-radius: 2px 1px 3px 1px; background: var(--dc); }
.day-no { grid-area: 1 / 1 / 2 / 3; align-self: center; margin: 0; font: 500 12px/1 var(--f-mono); letter-spacing: .16em; color: var(--dc); }
.day-head h2 { grid-area: 2 / 1; margin: 0; font: 700 2rem/1.15 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.day-head h2 .dow { font-size: 1rem; color: var(--ink-soft); margin-left: 6px; }
.day-theme { grid-area: 2 / 2 / 3 / 4; margin: 0; font: 700 1.05rem/1.4 var(--f-display); color: var(--ink); }
.route-link {
  grid-area: 1 / 3; align-self: center; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 13px;
  border: 1px solid var(--dc); border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--dc); text-decoration: none; white-space: nowrap;
  transition: background .2s, color .2s;
}
.route-link:hover { background: var(--dc); color: var(--pin-ink); }

.stops { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 2px; }
/* soft dry-brush rail: faint hair streaks over a soft stroke, ink thinning toward the end */
.stops::before {
  content: ""; position: absolute; left: 17px; top: 12px; bottom: 4px; width: 16px; transform: translateX(-50%);
  background:
    linear-gradient(90deg, transparent 0 38%, color-mix(in srgb, var(--paper) 28%, transparent) 41% 43%, transparent 46% 64%, color-mix(in srgb, var(--paper) 20%, transparent) 66% 67%, transparent 69%),
    linear-gradient(90deg, transparent 0 3%, color-mix(in srgb, var(--rail) 45%, transparent) 10%, var(--rail) 24% 70%, color-mix(in srgb, var(--rail) 55%, transparent) 84%, transparent 97%);
  border-radius: 8px 5px 9px 4px / 14px 8px 40px 24px;
  -webkit-mask-image: linear-gradient(180deg, transparent, var(--ink) 16px, var(--ink) 42%, color-mix(in srgb, var(--ink) 80%, transparent) 58%, var(--ink) 74%, var(--ink) calc(100% - 64px), transparent);
  mask-image: linear-gradient(180deg, transparent, var(--ink) 16px, var(--ink) 42%, color-mix(in srgb, var(--ink) 80%, transparent) 58%, var(--ink) 74%, var(--ink) calc(100% - 64px), transparent);
}
.stop {
  position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px;
  margin-left: -6px; padding: 11px 12px 11px 6px; border-radius: 12px; transition: background .2s, box-shadow .2s;
}
.stop.has-pin { cursor: pointer; }
.stop.is-active { background: var(--card); box-shadow: inset 0 0 0 1.5px var(--dc); }
.marker {
  position: relative; z-index: 1; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font: 500 13px/1 var(--f-mono); padding: 0; border: 3px solid var(--paper);
}
.has-pin .marker { background: var(--dc); color: var(--pin-ink); cursor: pointer; }
.no-pin .marker { background: var(--paper); color: var(--ink-soft); box-shadow: inset 0 0 0 1.5px var(--ink-soft); }
.stop.is-opt .marker { box-shadow: none; outline: 1.5px dashed var(--ink-soft); outline-offset: -4.5px; }
.stop.is-active .marker { border-color: var(--card); }
.stop-body { min-width: 0; display: grid; gap: 4px; align-content: start; padding-top: 4px; }
.stop-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-height: 24px; }
.kind { font: 500 12px/1.4 var(--f-body); letter-spacing: .12em; color: var(--ink-soft); }
.time { display: inline-flex; border: 1.5px solid var(--dc); border-radius: 6px; overflow: hidden; font: 700 12px/1 var(--f-body); color: var(--dc); }
.time .hm { padding: 4px 7px; background: var(--dc); color: var(--pin-ink); font: 500 12.5px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.time .tl { padding: 4px 7px 4px 6px; }
.opt { font-size: 12px; line-height: 1.4; color: var(--ink-soft); border: 1px dashed var(--ink-soft); padding: 1px 8px; border-radius: 4px; }
.stop-name { margin: 0; font: 700 1.125rem/1.4 var(--f-body); overflow-wrap: anywhere; }
/* 取車 / 還車: underlined in the original notes — a short brush stroke */
.car .stop-name { position: relative; justify-self: start; padding-bottom: 5px; }
.car .stop-name::after {
  content: ""; position: absolute; left: -2px; right: -5px; bottom: 0; height: 3px;
  background: var(--ink); border-radius: 3px 1px 2px 4px; transform: rotate(-1.2deg); opacity: .8;
}
.note { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.shops { margin: 6px 0 2px; display: grid; max-width: 34em; font-size: 13px; border-top: 1px dotted var(--perf); }
.shops div { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dotted var(--perf); }
.shops dt {
  justify-self: start; min-width: 28px; padding: 3px 4px; text-align: center;
  font: 500 11px/1 var(--f-mono); color: var(--dc); border: 1px solid var(--dc); border-radius: 4px;
}
.shops dd { margin: 0; color: var(--ink); line-height: 1.55; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.links a {
  display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 0 13px;
  font-size: 13px; font-weight: 500; text-decoration: none;
  border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); transition: border-color .2s, color .2s;
}
.links a:hover { border-color: var(--dc); color: var(--dc); }
.links a .arr { font-family: var(--f-mono); font-size: 11px; color: var(--dc); }

/* Footer */
.foot { padding-block: 12px 56px; }
.todo { border-top: 1.5px dashed var(--perf); padding-top: 22px; display: grid; gap: 8px; max-width: 65ch; }
.todo h2 { margin: 0; font: 700 1.25rem/1.3 var(--f-display); }
.todo ul { margin: 0 0 6px; padding: 0; list-style: none; display: grid; gap: 4px; }
.todo li { position: relative; padding-left: 24px; }
.todo li::before { content: ""; position: absolute; left: 2px; top: .45em; width: 12px; height: 12px; border: 1.5px solid var(--ink-soft); border-radius: 3px; }
.small { margin: 0; font-size: 12.5px; color: var(--ink-soft); }

@media (min-width: 900px) {
  .top { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 22px 48px; padding-block: 44px 22px; align-items: end; }
  .keys { grid-column: 1 / -1; }
  .main { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; gap: 40px; padding-block: 22px 40px; }
  .mapcard { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 88px); }
  .map-wrap { aspect-ratio: auto; height: calc(100vh - 176px); min-height: 460px; max-height: 860px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div class="page" lang="zh-Hant">
  <header class="wrap top">
    <div class="title">
      <p class="eyebrow">OKINAWA · 2026</p>
      <h1>沖繩自駕四日遊</h1>
      <p class="sub"><span class="nw">11/13（五）– 11/16（一）</span>・<span class="nw">4 天 3 夜</span>・<span class="nw">租車 11/13 – 11/15</span></p>
    </div>
    <div class="flights" id="flights" role="group" aria-label="航班"></div>
    <div class="keys" id="keys" role="group" aria-label="固定時間"></div>
  </header>

  <nav class="tabs-bar" aria-label="選擇日期">
    <div class="wrap tabs" id="tabs" role="tablist"></div>
  </nav>

  <main class="wrap main">
    <section class="mapcard" aria-label="地圖">
      <div class="map-wrap" id="mapWrap">
        <svg id="map" class="view-all" role="group" aria-label="沖繩本島行程地圖" xmlns="http://www.w3.org/2000/svg">

  const TOWNS = [
    { t: "那霸", x: -12.6, y: 28.8, cls: "town" },

    { t: "名護", x: 15.2, y: -14.0, cls: "town" },
    { t: "本部半島", x: 3.4, y: -20.6, cls: "town" },
    { t: "東海", x: -30, y: -4, cls: "ocean" },

  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const svg = $("map"), wrap = $("mapWrap");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  const gmap = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  const lerp = (a, b, t) => a + (b - a) * t;
  const mk = (tag, attrs = {}, parent) => {
    const el = document.createElementNS(NS, tag);

    if (parent) parent.appendChild(el);
    return el;
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  let todayStr = "";
  try {
    todayStr = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  } catch (e) {}
  const todayDay = (DAYS.find(d => d.date === todayStr) || {}).n;

  DAYS.forEach(d => d.stops.forEach((s, i) => { s.i = i + 1; s.day = d.n; s.id = `d${d.n}-s${i + 1}`; }));

  // ---------- Map ----------
  const land = $("land"), reef = $("reef");
  reef.setAttribute("d", land.getAttribute("d"));

  const towns = TOWNS.map(t => {

    el.textContent = t.t;

  const routes = DAYS.map(d => {
    const pts = d.stops.filter(s => s.pin && s.route !== false).map(s => PIN[s.pin]);

  const pins = [];

    const style = `--dc:var(--d${d.n})`;
    const lead = mk("line", { class: "lead", style }, $("gLead"));
    const anc = mk("circle", { class: "anchor", style }, $("gLead"));
    const g = mk("g", { class: "pin", tabindex: "0", role: "button", style, "aria-label": `第 ${d.n} 天第 ${s.i} 站：${s.name}` }, $("gPins"));
    mk("circle", { class: "ring", r: 11 }, g);

    lab.textContent = s.short || s.name;

  let W = 1, H = 1, cur = null, raf = 0, view = "all";

  function targetBox(v) {
    const full = pins.filter(p => v === "all" || p.d.n === v);
    let x0 = Math.min(...full.map(p => p.x)), x1 = Math.max(...full.map(p => p.x));
    let y0 = Math.min(...full.map(p => p.y)), y1 = Math.max(...full.map(p => p.y));
    const minSpan = 5;
    if (x1 - x0 < minSpan) { const c = (x0 + x1) / 2; x0 = c - minSpan / 2; x1 = c + minSpan / 2; }
    if (y1 - y0 < minSpan) { const c = (y0 + y1) / 2; y0 = c - minSpan / 2; y1 = c + minSpan / 2; }
    const m = v === "all" ? { l: 34, r: 34, t: 40, b: 44 } : { l: 100, r: 104, t: 50, b: 54 };
    const aw = Math.max(60, W - m.l - m.r), ah = Math.max(60, H - m.t - m.b);
    const k = Math.max((x1 - x0) / aw, (y1 - y0) / ah);
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    return { x: cx - (m.l + aw / 2) * k, y: cy - (m.t + ah / 2) * k, w: W * k, h: H * k };

  // Place pins so close ones don't cover each other (offsets in screen px, with a leader line).
  function layoutPins(v, vb) {
    const k = vb.w / W, placed = [];
    const order = pins.filter(p => v === "all" || p.d.n === v);
    pins.forEach(p => {
      p.full = v === "all" || p.d.n === v;
      p.sc1 = p.full ? (v === "all" ? 0.85 : 1) : 0.42;
      p.ox1 = 0; p.oy1 = 0;
      p.g.classList.toggle("is-dim", !p.full);
      p.g.setAttribute("tabindex", p.full ? "0" : "-1");
    });
    // Labels show only in day views; estimate their box (CJK ≈ 13px, Latin ≈ 7.5px per character).
    const labW = s => [...(s.short || s.name)].reduce((w, ch) => w + (ch.charCodeAt(0) > 255 ? 13 : 7.5), 0);
    const labRect = (p, cx, cy) => {
      if (v === "all") return null;
      const w = labW(p.s), x0 = p.s.lab === "l" ? cx - 16 - w : cx + 16;
      return [x0, cy - 9, x0 + w, cy + 9];
    };
    const circRect = (x, y, r, b) => Math.hypot(x - Math.max(b[0], Math.min(x, b[2])), y - Math.max(b[1], Math.min(y, b[3]))) < r;
    const rects = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
    order.forEach(p => {
      const sx = (p.x - vb.x) / k, sy = (p.y - vb.y) / k, R = 23 * p.sc1, f = p.sc1, r = 12 * f;
      const cands = [[0, 0]].concat(p.s.off ? [p.s.off] : [], [[26, -22], [-26, -22], [26, 22], [-26, 22], [0, -30], [0, 30], [36, 0], [-36, 0], [44, -40], [-44, -40], [44, 40], [-44, 40]]);
      const pinsClear = (cx, cy) => placed.every(q => Math.hypot(q.x - cx, q.y - cy) >= R);
      const allClear = (cx, cy) => {
        const mine = labRect(p, cx, cy);
        return placed.every(q => Math.hypot(q.x - cx, q.y - cy) >= R
          && !(q.rect && circRect(cx, cy, r, q.rect))
          && !(mine && (circRect(q.x, q.y, q.r, mine) || (q.rect && rects(mine, q.rect)))));
      };
      const c = cands.find(c => allClear(sx + c[0] * f, sy + c[1] * f))
        || cands.find(c => pinsClear(sx + c[0] * f, sy + c[1] * f)) || [0, 0];
      p.ox1 = c[0] * f; p.oy1 = c[1] * f;
      const x = sx + p.ox1, y = sy + p.oy1;
      placed.push({ x, y, r, rect: labRect(p, x, y) });
    });
    // Full pins on top; keep keyboard focus on a pin that gets re-appended.
    const fe = document.activeElement;
    order.forEach(p => $("gPins").appendChild(p.g));
    if (fe && fe.classList && fe.classList.contains("pin")) fe.focus({ preventScroll: true });
  }

  function draw() {
    const vb = cur, k = vb.w / W;
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    reef.setAttribute("stroke-width", 9 * k);
    land.setAttribute("stroke-width", 1 * k);
    routes.forEach(r => {
      r.el.setAttribute("stroke-width", (r.on ? 2.6 : 1.8) * k);
      r.el.setAttribute("stroke-dasharray", `${6 * k} ${5 * k}`);
    });
    pins.forEach(p => {
      const tx = p.x + p.ox * k, ty = p.y + p.oy * k;
      p.g.setAttribute("transform", `translate(${tx} ${ty}) scale(${p.sc * k})`);
      const off = p.full && Math.hypot(p.ox, p.oy) > 1;
      p.lead.style.display = off ? "" : "none";
      p.anc.style.display = off ? "" : "none";
      if (off) {

      if (t.cls === "ocean") {
        const sx = (t.x - vb.x) / k;
        t.el.style.display = sx < 40 || sx > W - 40 ? "none" : "";

  function fly(animate) {
    cancelAnimationFrame(raf);

    svg.classList.toggle("view-all", view === "all");
    svg.classList.toggle("view-day", view !== "all");

    const t0 = performance.now();
    const frame = now => {

      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const w = Math.exp(lerp(Math.log(vb0.w), Math.log(vb1.w), e));

  // ---------- Interaction ----------
  function hotStop(id, fromMap) {
    document.querySelectorAll(".stop.is-active").forEach(el => el.classList.remove("is-active"));
    pins.forEach(p => {
      p.g.classList.remove("is-hot");
      if (p.s.id === id) { void p.g.getBBox(); p.g.classList.add("is-hot"); }
    });
    const li = $(id);
    if (li) {
      li.classList.add("is-active");
      if (fromMap) li.scrollIntoView({ block: "nearest", behavior: reduce.matches ? "auto" : "smooth" });
    }
  }

  function onPin(p) {
    if (view !== "all" && p.d.n !== view) {
      goView(p.d.n);
      setTimeout(() => { hotStop(p.s.id, true); p.g.focus({ preventScroll: true }); }, 50);
    } else hotStop(p.s.id, true);
  }

  $("plan").addEventListener("click", e => {
    if (e.target.closest("a")) return;
    const li = e.target.closest(".stop.has-pin");
    if (li) hotStop(li.dataset.id, false);
  });

  $("keys").addEventListener("click", e => {
    const b = e.target.closest(".key");
    if (!b) return;
    const day = +b.dataset.id.match(/^d(\d)/)[1];
    goView(day);
    setTimeout(() => {
      hotStop(b.dataset.id, false);
      const li = $(b.dataset.id);
      if (li) li.scrollIntoView({ block: "center", behavior: reduce.matches ? "auto" : "smooth" });
    }, 60);
  });

  function parse(h) {
    const m = /^#?(all|day([1-4]))$/.exec(h || "");
    if (!m) return null;
    return m[2] ? +m[2] : "all";
  }

  function render(v, animate) {
    view = v;
    tabsEl.querySelectorAll(".tab").forEach(t => {
      const sel = t.dataset.v === (v === "all" ? "all" : "day" + v);
      t.setAttribute("aria-selected", sel ? "true" : "false");
      if (sel && t.scrollIntoView && animate) t.scrollIntoView({ block: "nearest", inline: "nearest" });
    });
    document.querySelectorAll(".day").forEach(s => { s.hidden = !(v === "all" || +s.dataset.day === v); });
    document.querySelectorAll(".stop.is-active").forEach(el => el.classList.remove("is-active"));
    pins.forEach(p => p.g.classList.remove("is-hot"));
    fly(animate);
  }

  function goView(v) {
    const h = v === "all" ? "all" : "day" + v;
    if (location.hash !== "#" + h) location.hash = h; else render(v, true);
  }

  tabsEl.addEventListener("click", e => {
    const t = e.target.closest(".tab");
    if (!t) return;
    const v = parse(t.dataset.v);
    goView(v);
    const main = document.querySelector(".main");
    const barH = document.querySelector(".tabs-bar").getBoundingClientRect().height;
    const top = main.getBoundingClientRect().top + window.scrollY - barH;
    if (window.scrollY > top) window.scrollTo({ top, behavior: reduce.matches ? "auto" : "smooth" });
  });

  window.addEventListener("hashchange", () => {
    const v = parse(location.hash);
    if (v !== null) render(v, true);
  });

  measure();
  render(parse(location.hash) ?? (todayDay || "all"), false);

  if ("ResizeObserver" in window) {
    new ResizeObserver(() => {
      const w = W, h = H;
      measure();
      if (Math.abs(w - W) > 0.5 || Math.abs(h - H) > 0.5) { cur = null; fly(false); }
    }).observe(wrap);
  }
})();
</script>

</html>
